
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "keybind-android.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto Android
        run: |
          mkdir -p extracted
          unzip -q keybind-android.zip -d extracted
          echo "Conteudo do ZIP:"
          find extracted -maxdepth 4 \
            \( -name settings.gradle -o \
               -name settings.gradle.kts -o \
               -name build.gradle -o \
               -name build.gradle.kts \) -print
          PROJECT_DIR=$(find extracted -type f \
            \( -name settings.gradle -o \
               -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Nao encontrei o arquivo settings.gradle."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-android
          path: |
            extracted/**/*.apk
          if-no-files-found: error
          
